name: Continuous integration

on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

env:
  POETRY_INSTALLER_ONLY_BINARY: "true"
  POETRY_INSTALLER_NO_BINARY: markdown-table,pylint-celery

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
        if: matrix.python-version != '3.7'
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      - name: Install with Poetry
        run: poetry install

      - name: Prospector
        run: |
          poetry run prospector --output-format=pylint --direct-tool-stdout

      # Mark as success
      - id: success
        run: echo "success=true" >> $GITHUB_OUTPUT

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: main
    if: always()

    permissions:
      contents: read
      id-token: write

    steps:
      - run: '[[ "${{ needs.main.outputs.success }}" == "true" ]]'

      # The full history is required to compute the version from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Provides the pip, python3 and poetry that tag-publish calls to build the wheel.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          cache-python: true
          python-version: "3.13"

      # tag-publish logs in to PyPI by itself with the OpenId Connect token, and only when it publishes.
      - name: Publish
        run: uv run --locked --isolated --no-build --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
